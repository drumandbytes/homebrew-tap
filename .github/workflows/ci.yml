name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  style:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # eraser.rb is generated by GoReleaser, which renders custom_block above
      # `version`; the stanza order can't be fixed from its config.
      - run: brew style $(ls Casks/*.rb | grep -v '/eraser\.rb$')

  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # The one name the ruleset requires, however the jobs above change.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [style, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
